name: ${COMPOSE_PROJECT_NAME:-reading-transition}
services:
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-reading-transition}-db
    environment:
      MYSQL_DATABASE: research
      MYSQL_USER: research
      MYSQL_PASSWORD: research_demo
      MYSQL_ROOT_PASSWORD: root_research_demo
    ports: ["${DB_PORT:-17747}:3306"]
    volumes: ["db-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uresearch -presearch_demo --silent"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-reading-transition}-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-reading-transition}-backend
    environment: &env
      DATABASE_URL: mysql+pymysql://research:research_demo@db:3306/research?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-reading-transition-demo-secret-change-before-deployment}
      SEED_DEMO: ${SEED_DEMO:-true}
      ARTIFACT_DIR: /artifacts
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports: ["${BACKEND_PORT:-19247}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 15s
  worker:
    build: ./backend
    container_name: ${COMPOSE_PROJECT_NAME:-reading-transition}-worker
    command: ["python", "-m", "src.worker"]
    environment: *env
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import time;assert time.time()-float(open('/artifacts/heartbeat').read())<120"]
      interval: 5s
      timeout: 4s
      retries: 25
      start_period: 20s
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-reading-transition}-frontend
    ports: ["${FRONTEND_PORT:-18247}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
